[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nl2sql"
version = "0.1.0"
description = "Guarded natural language to SQL for Azure SQL: schema grounding, layered guardrails, least-privilege execution and an honest eval harness."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sharath Chandra Kampili", email = "sharath568@gmail.com" }]
keywords = ["nl2sql", "text-to-sql", "azure-sql", "sql-server", "llm", "guardrails", "azure-openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    # The guardrails depend on sqlglot's AST shapes; upgrade the major version
    # deliberately and re-run the guardrail tests when you do.
    "sqlglot>=30.0,<31",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# SQL Server / Azure SQL drivers. Pick one. mssql-python ships its own driver;
# pyodbc needs the Microsoft ODBC Driver 18 installed on the machine.
mssql = ["mssql-python>=0.13"]
pyodbc = ["pyodbc>=5.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nl2sql = "nl2sql.cli:main"

[project.urls]
Homepage = "https://github.com/sharath568/azure-data-nl2sql"
Issues = "https://github.com/sharath568/azure-data-nl2sql/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nl2sql"]

[tool.hatch.build.targets.sdist]
include = ["src/nl2sql", "sql", "tests", "scripts", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real SQL Server / Azure SQL (set NL2SQL_TEST_CONN)",
]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PIE", "PT"]
# QueryTimeout reads better than QueryTimeoutError at the call site.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# `assert a and b` is fine in tests; one failing line still says what broke.
"tests/**" = ["PT018"]
